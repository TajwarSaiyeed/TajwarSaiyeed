<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    .card {
      animation: fadeIn 0.8s ease-in-out forwards;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
  </defs>
  <g class="card">
    <rect x="0.5" y="0.5" width="494" height="194" rx="12" fill="#0d1117" stroke="#30363d" />
    
    <text x="25" y="35" font-size="15" font-weight="700" fill="url(#accentGrad)">LeetCode Stats</text>
    
    <!-- Circle Ring -->
    <g transform="translate(105, 100)">
      <circle cx="0" cy="0" r="42" stroke="#21262d" stroke-width="6" fill="none" />
      <circle cx="0" cy="0" r="42" stroke="url(#accentGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="263.89" stroke-dashoffset="235.96" transform="rotate(-90 0 0)" />
      <text x="0" y="-3" text-anchor="middle" font-size="19" font-weight="700" fill="#c9d1d9">435</text>
      <text x="0" y="15" text-anchor="middle" font-size="11" fill="#8b949e">Solved</text>
      <text x="0" y="65" text-anchor="middle" font-size="12" fill="#8b949e">Ranking <tspan fill="#c9d1d9" font-weight="600">#285,035</tspan></text>
    </g>

    <line x1="205" y1="52" x2="205" y2="168" stroke="#30363d" />

    <!-- Progress Bars -->
    <g transform="translate(225, 0)">
      <!-- Easy -->
      <text x="0" y="68" font-size="12" font-weight="600" fill="#2ea043">Easy</text>
      <text x="245" y="68" font-size="12" text-anchor="end" fill="#8b949e"><tspan fill="#c9d1d9" font-weight="600">223</tspan> / 975</text>
      <rect x="0" y="76" width="245" height="7" rx="3.5" fill="#21262d" />
      <rect x="0" y="76" width="56.03589743589743" height="7" rx="3.5" fill="#2ea043" />

      <!-- Medium -->
      <text x="0" y="108" font-size="12" font-weight="600" fill="#d29922">Medium</text>
      <text x="245" y="108" font-size="12" text-anchor="end" fill="#8b949e"><tspan fill="#c9d1d9" font-weight="600">165</tspan> / 2146</text>
      <rect x="0" y="116" width="245" height="7" rx="3.5" fill="#21262d" />
      <rect x="0" y="116" width="18.837371854613234" height="7" rx="3.5" fill="#d29922" />

      <!-- Hard -->
      <text x="0" y="148" font-size="12" font-weight="600" fill="#f85149">Hard</text>
      <text x="245" y="148" font-size="12" text-anchor="end" fill="#8b949e"><tspan fill="#c9d1d9" font-weight="600">47</tspan> / 989</text>
      <rect x="0" y="156" width="245" height="7" rx="3.5" fill="#21262d" />
      <rect x="0" y="156" width="11.643073811931243" height="7" rx="3.5" fill="#f85149" />
    </g>
  
  </g>
</svg>