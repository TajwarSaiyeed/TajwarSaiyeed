<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    .card {
      animation: fadeIn 0.8s ease-in-out forwards;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
  </defs>
  <g class="card">
    <rect x="0.5" y="0.5" width="494" height="194" rx="12" fill="#0d1117" stroke="#30363d" />
    
    <text x="25" y="35" font-size="15" font-weight="700" fill="url(#accentGrad)">Contribution Streak</text>
    
    <!-- Total Contributions -->
    <g transform="translate(100, 0)">
      <text x="0" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#c9d1d9">12,619</text>
      <text x="0" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#8b949e">Total Contributions</text>
      <text x="0" y="142" text-anchor="middle" font-size="10" fill="#8b949e">Jan 1, 2022 - Present</text>
    </g>

    <!-- Divider 1 -->
    <line x1="185" y1="60" x2="185" y2="160" stroke="#30363d" />

    <!-- Current Streak Center Ring -->
    <g transform="translate(247, 0)">
      <circle cx="0" cy="95" r="32" stroke="#21262d" stroke-width="5" fill="none" />
      <circle cx="0" cy="95" r="32" stroke="url(#accentGrad)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="201.06" stroke-dashoffset="0.00" transform="rotate(-90 0 95)" />
      <text x="0" y="101" text-anchor="middle" font-size="19" font-weight="700" fill="url(#accentGrad)">695</text>
      <text x="0" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#c9d1d9">Current Streak</text>
      <text x="0" y="162" text-anchor="middle" font-size="10" fill="#8b949e">Dec 19, 2024 - Nov 13, 2026</text>
    </g>

    <!-- Divider 2 -->
    <line x1="310" y1="60" x2="310" y2="160" stroke="#30363d" />

    <!-- Longest Streak -->
    <g transform="translate(395, 0)">
      <text x="0" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#c9d1d9">695</text>
      <text x="0" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#8b949e">Longest Streak</text>
      <text x="0" y="142" text-anchor="middle" font-size="10" fill="#8b949e">Dec 19, 2024 - Nov 13, 2026</text>
    </g>
  
  </g>
</svg>